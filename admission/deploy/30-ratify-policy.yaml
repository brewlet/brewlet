####################################################################
# Ratify verification policy.
#
# Requires the Brewlet managed-dependency attestation to be present and
# to pass verification for every subject. `all` means every discovered
# referrer of the artifactType must verify; combined with the Gatekeeper
# constraint, an image with no valid Brewlet attestation is denied.
#
# NOTE ON FAIL-CLOSED-ON-MISSING: absence of any attestation referrer is
# enforced at the policy/aggregation layer, not by the plugin (which is
# only invoked once a matching referrer exists). Validate on YOUR Ratify
# version that an image with no Brewlet attestation is denied, using the
# smoke test in admission/README.md, before relying on this in production.
####################################################################
apiVersion: config.ratify.deislabs.io/v1beta1
kind: Policy
metadata:
  # metadata.name MUST be ratify-policy in v1beta1.
  name: ratify-policy
spec:
  type: config-policy
  parameters:
    artifactVerificationPolicies:
      application/vnd.brewlet.attestation.v1+json: all
      default: all
