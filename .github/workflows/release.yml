name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Image - ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: operator
            image: operator
            context: kubernetes
            file: kubernetes/Dockerfile
            build_args: CMD=manager
          - name: admission
            image: admission
            context: kubernetes
            file: kubernetes/Dockerfile
            build_args: CMD=admission
          - name: node-provisioner
            image: node-provisioner
            context: .
            file: provisioner/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ghcr.io/brewlet/${{ matrix.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/brewlet/brewlet
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: images
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@v4

      - name: Package chart
        run: |
          helm lint kubernetes/charts/brewlet
          helm package kubernetes/charts/brewlet \
            --version "${{ steps.version.outputs.version }}" \
            --app-version "${{ steps.version.outputs.version }}" \
            --destination dist

      - name: Publish chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          helm push "dist/brewlet-${{ steps.version.outputs.version }}.tgz" \
            oci://ghcr.io/brewlet/charts

  cli:
    name: CLI - ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod

      - name: Build archive
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go -C core build \
            -trimpath \
            -ldflags="-s -w -X main.version=$VERSION" \
            -o ../dist/brewlet \
            ./cmd/brewlet
          tar -C dist -czf "brewlet_${VERSION}_${GOOS}_${GOARCH}.tar.gz" brewlet

      - uses: actions/upload-artifact@v4
        with:
          name: brewlet-${{ matrix.os }}-${{ matrix.arch }}
          path: brewlet_*.tar.gz
          if-no-files-found: error

  maven-plugin:
    name: Maven plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Resolve version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: maven-plugin/pom.xml

      - name: Build release artifact
        working-directory: maven-plugin
        run: |
          mvn -B --no-transfer-progress \
            versions:set \
            -DnewVersion="${{ steps.version.outputs.version }}" \
            -DgenerateBackupPoms=false
          mvn -B --no-transfer-progress verify
          mkdir -p ../dist
          cp "target/brewlet-maven-plugin-${{ steps.version.outputs.version }}.jar" ../dist/
          cp pom.xml "../dist/brewlet-maven-plugin-${{ steps.version.outputs.version }}.pom"

      - uses: actions/upload-artifact@v4
        with:
          name: brewlet-maven-plugin
          path: dist/brewlet-maven-plugin-*
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: [images, chart, cli, maven-plugin]
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: brewlet-*
          merge-multiple: true
          path: dist

      - name: Create checksums
        working-directory: dist
        run: sha256sum brewlet* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/brewlet_*.tar.gz
            dist/brewlet-maven-plugin-*.jar
            dist/brewlet-maven-plugin-*.pom
            dist/checksums.txt
