name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "CNAME"
      - "install.sh"
      - "mkdocs.yml"
      - "docs/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify installer, public release, and Getting Started
        run: ./scripts/verify-release-artifacts.sh 0.1.0

  deploy:
    needs: release-smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build docs site
        run: |
          python -m pip install --upgrade pip
          pip install --quiet mkdocs mkdocs-material
          python -m mkdocs build --strict
      - name: Assemble publish directory
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='docs' \
            --exclude='_site' \
            ./ _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
