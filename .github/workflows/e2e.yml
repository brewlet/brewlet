name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tiers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Local CLI and JVM (tiers 1-2)
            tiers: --tier 1 --tier 2
            java: true
            cluster: false
            helm: false
          - name: Shim to runc (tier 3)
            tiers: --tier 3
            java: true
            cluster: false
            helm: false
          - name: Kubernetes control plane (tiers 4-6, 13)
            tiers: --tier 4 --tier 5 --tier 6 --tier 13
            java: false
            cluster: true
            helm: true
          - name: Spring PetClinic (tier 7)
            tiers: --tier 7
            java: true
            cluster: true
            helm: true
          - name: Node-side AppCDS (tier 8)
            tiers: --tier 8
            java: true
            cluster: true
            helm: false
          - name: Serving and cgroups (tier 9)
            tiers: --tier 9
            java: true
            cluster: true
            helm: false
          - name: Helm installation (tier 10)
            tiers: --tier 10
            java: false
            cluster: true
            helm: true
          - name: Webhook resilience (tier 11)
            tiers: --tier 11
            java: false
            cluster: true
            helm: false
          - name: Runnable image (tier 12)
            tiers: --tier 12
            java: true
            cluster: true
            helm: false
          - name: Custom JDK NodeProfile (tier 14)
            tiers: --tier 14
            java: true
            cluster: true
            helm: false
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            kubernetes/go.sum

      - name: Set up JDK
        if: matrix.java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Helm
        if: matrix.helm
        uses: azure/setup-helm@v4

      - name: Create kind cluster
        if: matrix.cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: brewlet-e2e

      - name: Run tiers
        run: integration-tests/e2e/run.sh ${{ matrix.tiers }}
